<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Diagram - Đổi Mật Khẩu Email Web Bán Hàng</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f8f9fa;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 30px 20px 20px;
            max-width: 860px;
        }
        h1 {
            text-align: center;
            font-size: 17px;
            color: #b71c1c;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        svg { display: block; margin: 0 auto; }

        /* ---- Shared text styles ---- */
        .txt        { font-family: 'Inter','Segoe UI',sans-serif; fill: #222; }
        .txt-act    { font-size: 12.5px; text-anchor: middle; dominant-baseline: middle; }
        .txt-dec    { font-size: 11px;   text-anchor: middle; dominant-baseline: middle; }
        .txt-lbl    { font-size: 10.5px; fill: #444; }
        .txt-lane   { font-size: 14px;   font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
        .txt-pool   { font-size: 13px;   font-weight: 700; text-anchor: middle; dominant-baseline: middle; }

        /* ---- Shape styles ---- */
        .act  { fill: #fff; stroke: #333; stroke-width: 1.4; }
        .dec  { fill: #fff; stroke: #333; stroke-width: 1.4; }
        .lane { fill: none;  stroke: #333; stroke-width: 1.4; }
        .hdr  { fill: #f0f0f0; stroke: #333; stroke-width: 1.4; }
        .arr  { stroke: #333; stroke-width: 1.4; fill: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Sơ đồ Activity Diagram chức năng đổi mật khẩu email web bán hàng</h1>

    <svg width="810" height="1120" viewBox="0 0 810 1120">
        <defs>
            <marker id="ah" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto" fill="#333">
                <polygon points="0 0, 9 3, 0 6"/>
            </marker>
        </defs>

        <!-- ╔══════════════════════════════════════╗
             ║          POOL + LANE OUTLINES         ║
             ╚══════════════════════════════════════╝ -->

        <!-- Pool outer border -->
        <rect x="30" y="20" width="760" height="1080" class="lane"/>

        <!-- Pool vertical label strip -->
        <rect x="30" y="20" width="30" height="1080" class="hdr"/>
        <text x="45" y="560" class="txt txt-pool" transform="rotate(-90,45,560)">Pool</text>

        <!-- Khách hàng lane area -->
        <rect x="60" y="20" width="360" height="1080" class="lane" style="stroke-width:0.6"/>
        <!-- Khách hàng header -->
        <rect x="60" y="20" width="360" height="32" class="hdr"/>
        <text x="240" y="36" class="txt txt-lane">Khách hàng</text>

        <!-- Hệ thống lane area -->
        <rect x="420" y="20" width="370" height="1080" class="lane" style="stroke-width:0.6"/>
        <!-- Hệ thống header -->
        <rect x="420" y="20" width="370" height="32" class="hdr"/>
        <text x="605" y="36" class="txt txt-lane">Hệ thống</text>

        <!-- Lane divider dashed -->
        <line x1="420" y1="52" x2="420" y2="1100" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>

        <!-- ╔══════════════════════════════════════╗
             ║            DIAGRAM NODES              ║
             ╚══════════════════════════════════════╝ -->

        <!-- ●  START  -->
        <circle cx="240" cy="82" r="13" fill="#222"/>
        <line x1="240" y1="95" x2="240" y2="122" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 1. Truy cập trang thông tin cá nhân ─────────── -->
        <rect x="130" y="128" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="240" y="148" class="txt txt-act">Truy cập vào trang</text>
        <text x="240" y="164" class="txt txt-act">thông tin cá nhân</text>

        <!-- → cross lane to Hệ thống -->
        <line x1="350" y1="154" x2="488" y2="154" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 2. Hiển thị thông tin cá nhân (HT) ─────────── -->
        <rect x="494" y="128" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="604" y="148" class="txt txt-act">Hiển thị thông tin</text>
        <text x="604" y="164" class="txt txt-act">cá nhân</text>

        <!-- ← back to Khách hàng -->
        <line x1="604" y1="180" x2="604" y2="200" class="arr"/>
        <line x1="604" y1="200" x2="240" y2="200" class="arr"/>
        <line x1="240" y1="200" x2="240" y2="228" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 3. Chọn chức năng đổi mật khẩu ─────────── -->
        <rect x="130" y="234" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="240" y="254" class="txt txt-act">Chọn chức năng</text>
        <text x="240" y="270" class="txt txt-act">đổi mật khẩu</text>

        <!-- → cross lane -->
        <line x1="350" y1="260" x2="488" y2="260" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 4. Gửi mã code & Hiển thị form (HT) ─────────── -->
        <rect x="494" y="234" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="604" y="248" class="txt txt-act">Gửi mã code qua email</text>
        <text x="604" y="264" class="txt txt-act">& hiển thị form</text>
        <text x="604" y="278" class="txt txt-act">email và mã code</text>

        <!-- ← back -->
        <line x1="604" y1="286" x2="604" y2="310" class="arr"/>
        <line x1="604" y1="310" x2="240" y2="310" class="arr"/>
        <line x1="240" y1="310" x2="240" y2="340" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 5. Nhập code từ email ─────────── -->
        <rect x="130" y="346" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="240" y="372" class="txt txt-act">Nhập code từ email</text>

        <!-- → to decision -->
        <line x1="350" y1="372" x2="604" y2="372" class="arr"/>
        <line x1="604" y1="372" x2="604" y2="408" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── D1: Kiểm tra mã code ─────────── -->
        <polygon points="604,418 668,460 604,502 540,460" class="dec"/>
        <text x="604" y="454" class="txt txt-dec">Kiểm tra</text>
        <text x="604" y="470" class="txt txt-dec">mã code?</text>

        <!-- D1 — Không hợp lệ → thông báo lỗi (bên phải) -->
        <line x1="668" y1="460" x2="718" y2="460" class="arr" marker-end="url(#ah)"/>
        <text x="676" y="450" class="txt txt-lbl">Không</text>
        <text x="676" y="462" class="txt txt-lbl">hợp lệ</text>

        <!-- Thông báo lỗi mã code -->
        <rect x="724" y="438" width="56" height="44" class="act" rx="10" ry="10"/>
        <text x="752" y="454" class="txt" style="font-size:9px;text-anchor:middle;dominant-baseline:middle">Thông báo</text>
        <text x="752" y="467" class="txt" style="font-size:9px;text-anchor:middle;dominant-baseline:middle">lỗi</text>

        <!-- Loop back to "Nhập code" -->
        <path d="M752,438 L752,372 L350,372" class="arr" marker-end="url(#ah)"/>

        <!-- D1 — Hợp lệ ↓ -->
        <line x1="604" y1="502" x2="604" y2="545" class="arr" marker-end="url(#ah)"/>
        <text x="616" y="528" class="txt txt-lbl">Hợp lệ</text>

        <!-- ─────────── 6. Hiển thị form nhập mật khẩu mới (HT) ─────────── -->
        <rect x="494" y="550" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="604" y="570" class="txt txt-act">Hiển thị form nhập</text>
        <text x="604" y="586" class="txt txt-act">mật khẩu mới</text>

        <!-- ← to Khách hàng -->
        <line x1="494" y1="576" x2="356" y2="576" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 7. Nhập mật khẩu mới ─────────── -->
        <rect x="130" y="550" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="240" y="570" class="txt txt-act">Nhập mật khẩu mới</text>
        <text x="240" y="586" class="txt txt-act">và xác nhận mật khẩu</text>

        <!-- → to decision D2 -->
        <line x1="240" y1="602" x2="240" y2="632" class="arr"/>
        <line x1="240" y1="632" x2="604" y2="632" class="arr"/>
        <line x1="604" y1="632" x2="604" y2="656" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── D2: Kiểm tra mật khẩu hợp lệ ─────────── -->
        <polygon points="604,666 668,708 604,750 540,708" class="dec"/>
        <text x="604" y="702" class="txt txt-dec">Mật khẩu</text>
        <text x="604" y="718" class="txt txt-dec">hợp lệ?</text>

        <!-- D2 — Không hợp lệ → thông báo lỗi -->
        <line x1="668" y1="708" x2="718" y2="708" class="arr" marker-end="url(#ah)"/>
        <text x="676" y="698" class="txt txt-lbl">Không</text>
        <text x="676" y="710" class="txt txt-lbl">hợp lệ</text>

        <!-- Thông báo lỗi MK -->
        <rect x="724" y="686" width="56" height="44" class="act" rx="10" ry="10"/>
        <text x="752" y="702" class="txt" style="font-size:9px;text-anchor:middle;dominant-baseline:middle">Thông báo</text>
        <text x="752" y="715" class="txt" style="font-size:9px;text-anchor:middle;dominant-baseline:middle">lỗi</text>

        <!-- Loop back to "Nhập MK mới" -->
        <path d="M752,686 L752,576 L356,576" class="arr" marker-end="url(#ah)"/>

        <!-- D2 — Hợp lệ ↓ -->
        <line x1="604" y1="750" x2="604" y2="790" class="arr" marker-end="url(#ah)"/>
        <text x="616" y="776" class="txt txt-lbl">Hợp lệ</text>

        <!-- ─────────── 8. Cập nhật mật khẩu thành công (HT) ─────────── -->
        <rect x="494" y="796" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="604" y="816" class="txt txt-act">Cập nhật mật khẩu</text>
        <text x="604" y="832" class="txt txt-act">thành công</text>

        <!-- ↓ -->
        <line x1="604" y1="848" x2="604" y2="878" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 9. Hiển thị thông báo thành công (HT) ─────────── -->
        <rect x="494" y="884" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="604" y="904" class="txt txt-act">Hiển thị thông báo</text>
        <text x="604" y="920" class="txt txt-act">đổi mật khẩu thành công</text>

        <!-- ← to KH -->
        <line x1="494" y1="910" x2="356" y2="910" class="arr" marker-end="url(#ah)"/>

        <!-- ─────────── 10. Xác nhận kết quả (KH) ─────────── -->
        <rect x="130" y="884" width="220" height="52" class="act" rx="15" ry="15"/>
        <text x="240" y="910" class="txt txt-act">Xác nhận kết quả</text>

        <!-- ↓ to END -->
        <line x1="240" y1="936" x2="240" y2="975" class="arr" marker-end="url(#ah)"/>

        <!-- ◉  END  -->
        <circle cx="240" cy="990" r="15" fill="none" stroke="#222" stroke-width="2.5"/>
        <circle cx="240" cy="990" r="9" fill="#222"/>
    </svg>
</div>
</body>
</html>
