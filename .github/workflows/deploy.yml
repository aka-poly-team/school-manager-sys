name: CI/CD Pipeline - Build & Test AKA System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn dự án từ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Cấu hình môi trường Java 17 Temurin
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Biên dịch và Đóng gói file JAR bằng Maven (dùng lệnh mvn có sẵn)
    - name: Build Executable JAR with Maven
      run: mvn clean package -DskipTests

    # 4. Kiểm tra Tự động Đóng gói Docker Image
    - name: Build Docker Image
      run: docker build -t aka-system:latest .
