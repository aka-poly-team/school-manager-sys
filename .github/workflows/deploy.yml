name: CI/CD Pipeline - Build Docker Image & Deploy AKA System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn dự án từ GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Cấu hình môi trường Java 17 Temurin
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Biên dịch và Đóng gói file JAR bằng Maven (Bỏ qua Unit Test để build nhanh)
    - name: Build Executable JAR with Maven
      run: ./mvnw clean package -DskipTests

    # 4. Đăng nhập vào kho lưu trữ Docker Hub (Tự động nạp Secret credentials)
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Tự động Build Docker Image và Đẩy (Push) lên Server/Docker Hub
    - name: Build & Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/aka-system:latest
          ${{ secrets.DOCKER_USERNAME }}/aka-system:${{ github.sha }}

    # 6. Triển khai tự động (Auto-deploy) lên Server thông qua Docker Compose
    - name: Deploy to Server via SSH
      if: github.event_name != 'pull_request' && secrets.SERVER_HOST != ''
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /app/aka-system
          git pull origin main
          docker compose down
          docker compose up -d --build
