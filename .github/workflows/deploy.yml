name: CI/CD Pipeline - Build Docker Image & Deploy AKA System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn dự án từ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Cấu hình môi trường Java 17 Temurin
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Cấp quyền thực thi cho Maven Wrapper
    - name: Make ./mvnw executable
      run: chmod +x ./mvnw

    # 4. Biên dịch và Đóng gói file JAR bằng Maven (Bỏ qua Unit Test để build nhanh)
    - name: Build Executable JAR with Maven
      run: ./mvnw clean package -DskipTests

    # 5. Kiểm tra Build Docker Image
    - name: Build Docker Image
      run: docker build -t aka-system:latest .

    # 6. Đăng nhập vào Docker Hub (Nếu có cài đặt Secrets DOCKER_USERNAME)
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && secrets.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 7. Đẩy Docker Image lên Docker Hub (Nếu có Secrets DOCKER_USERNAME)
    - name: Build & Push Docker Image to Docker Hub
      if: github.event_name == 'push' && secrets.DOCKER_USERNAME != ''
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/aka-system:latest
          ${{ secrets.DOCKER_USERNAME }}/aka-system:${{ github.sha }}

    # 8. Triển khai tự động (Auto-deploy) lên Server qua SSH (Nếu có Secrets SERVER_HOST)
    - name: Deploy to Server via SSH
      if: github.event_name == 'push' && secrets.SERVER_HOST != ''
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /app/aka-system
          git pull origin main
          docker compose down
          docker compose up -d --build
