services:
  # Container 1: CSDL Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aka-sqlserver-db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AkaSystem@123456
      - MSSQL_PID=Developer
    ports:
      - "14333:1433" # Cổng 14333 bên ngoài chống xung đột 100% với SQL Server sẵn có trên máy
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        sleep 12
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P AkaSystem@123456 -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'aka') CREATE DATABASE [aka];"
        wait
    volumes:
      - mssql_data:/var/opt/mssql

  # Container 2: Ứng dụng Web Spring Boot AKA-SYSTEM
  aka-app:
    build: .
    container_name: aka-system-web
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - sqlserver
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=aka;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=AkaSystem@123456
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=0

volumes:
  mssql_data:
