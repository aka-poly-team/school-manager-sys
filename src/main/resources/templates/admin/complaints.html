<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt Khiếu Nại - Admin AKA</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- ADMIN SIDEBAR FRAGMENT -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar('complaints')}"></div>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Giải Quyết Khiếu Nại Tiết Dạy</h1>
                    <p class="page-subtitle">Duyệt yêu cầu điều chỉnh số tiết thực tế của giáo viên</p>
                </div>
            </div>

            <!-- TABLE OF COMPLAINTS -->
            <div class="card-box">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>MÃ</th>
                            <th>GIÁO VIÊN</th>
                            <th>BUỔI DẠY</th>
                            <th>SỐ TIẾT</th>
                            <th>NỘI DUNG KHIẾU NẠI</th>
                            <th>TRẠNG THÁI</th>
                            <th>HÀNH ĐỘNG</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cmp : ${complaints}">
                            <td th:text="${'#' + cmp.id}">#1</td>
                            <td th:text="${cmp.attendance != null and cmp.attendance.teacher != null ? cmp.attendance.teacher.name : 'Giáo viên'}">GV Mai</td>
                            <td th:text="${cmp.attendance != null ? (#temporals.format(cmp.attendance.date, 'dd/MM/yyyy') + ' - ' + cmp.attendance.session) : 'Buổi dạy'}">29/07/2026</td>
                            <td><strong th:text="${cmp.expectedPeriods}">3</strong></td>
                            <td th:text="${cmp.content}">Nội dung khiếu nại</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${cmp.status == 1 ? 'approved' : (cmp.status == 2 ? 'rejected' : 'pending')}" 
                                      th:text="${cmp.status == 1 ? 'Đã duyệt' : (cmp.status == 2 ? 'Từ chối' : 'Chờ duyệt')}">Chờ duyệt</span>
                            </td>
                            <td>
                                <div class="form-actions form-actions-reset">
                                    <form th:action="@{/admin/complaints/{id}/approve(id=${cmp.id})}" method="post">
                                        <button type="submit" class="action-btn dark">Duyệt</button>
                                    </form>
                                    <form th:action="@{/admin/complaints/{id}/reject(id=${cmp.id})}" method="post">
                                        <button type="submit" class="action-btn gray">Từ chối</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="7" class="empty-table-cell">Không có khiếu nại nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script th:src="@{/js/teacher-dashboard.js}"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
