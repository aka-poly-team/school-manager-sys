<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editUser != null ? 'Chỉnh Sửa Tài Khoản - Admin AKA' : 'Thêm Tài Khoản Mới - Admin AKA'}">Tài Khoản - Admin AKA</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
</head>
<body>
    <div class="app-container">
        <!-- ADMIN SIDEBAR FRAGMENT -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar('teachers')}"></div>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title" th:text="${editUser != null ? 'Chỉnh Sửa Tài Khoản & Phân Quyền' : 'Thêm Mới Tài Khoản & Giáo Viên'}">Tài Khoản</h1>
                    <p class="page-subtitle">Cập nhật thông tin tài khoản và vai trò người dùng trong hệ thống</p>
                </div>
            </div>

            <!-- FORM CHỈNH SỬA / THÊM MỚI TÀI KHOẢN -->
            <div class="card-box card-box-md margin-center">
                <div class="box-header">
                    <h2 class="box-title" style="color: #f97316;" th:if="${editUser != null}">
                        Chỉnh Sửa Tài Khoản: <span th:text="${editUser.username}"></span>
                    </h2>
                    <h2 class="box-title" style="color: #2563eb;" th:unless="${editUser != null}">
                        Khai Báo Tài Khoản & Hồ Sơ Giáo Viên Mới
                    </h2>
                </div>

                <form th:action="${editUser != null ? '/admin/teachers/edit/' + editUser.id : '/admin/teachers/new'}" method="post" class="form-layout">
                    <div class="form-group" th:if="${editUser != null}">
                        <label class="form-label">Tên đăng nhập (Username)</label>
                        <input type="text" th:value="${editUser.username}" readonly disabled class="form-control" style="background-color: #f1f5f9; cursor: not-allowed; color: #64748b;">
                    </div>

                    <div class="form-group" th:unless="${editUser != null}">
                        <label class="form-label">Tên đăng nhập (Username / Email) *</label>
                        <input type="text" name="username" placeholder="Nhập tên đăng nhập hoặc email..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Họ và Tên Giáo viên *</label>
                        <input type="text" name="name" 
                               th:value="${editUser != null and editUser.teacher != null ? editUser.teacher.name : (editUser != null ? editUser.username : '')}" 
                               placeholder="Nhập họ và tên giáo viên..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email liên hệ</label>
                        <input type="email" name="email" 
                               th:value="${editUser != null and editUser.teacher != null ? editUser.teacher.email : ''}" 
                               placeholder="Nhập địa chỉ email..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" name="phone" 
                               th:value="${editUser != null and editUser.teacher != null ? editUser.teacher.phone : ''}" 
                               placeholder="Nhập số điện thoại..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label" th:text="${editUser != null ? 'Mật khẩu mới (Bỏ trống nếu giữ nguyên)' : 'Mật khẩu đăng nhập (Mặc định: 123456)'}">Mật khẩu</label>
                        <input type="password" name="password" placeholder="Nhập mật khẩu..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phân quyền Hệ thống</label>
                        <select name="role" class="form-control">
                            <option value="ROLE_TEACHER" th:selected="${editUser != null and editUser.role != null and editUser.role.name() == 'ROLE_TEACHER'}">Giáo viên (ROLE_TEACHER)</option>
                            <option value="ROLE_ADMIN" th:selected="${editUser != null and editUser.role != null and editUser.role.name() == 'ROLE_ADMIN'}">Quản trị hệ thống (ROLE_ADMIN)</option>
                        </select>
                    </div>

                    <div class="form-actions modal-actions">
                        <a th:href="@{/admin/teachers}" class="action-btn gray">Hủy bỏ</a>
                        <button type="submit" class="action-btn blue" th:text="${editUser != null ? 'Cập Nhật Thông Tin' : 'Lưu Tài Khoản Mới'}">Lưu Tài Khoản</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
