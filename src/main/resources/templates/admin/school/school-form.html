<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${school != null ? 'Chỉnh Sửa Trường Mầm Non - Admin AKA' : 'Thêm Trường Mầm Non - Admin AKA'}">Thêm Trường Mầm Non - Admin AKA</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-validate.css}">
</head>
<body>
    <div class="app-container">
        <!-- ADMIN SIDEBAR FRAGMENT -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar('schools')}"></div>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title" th:text="${school != null ? 'Chỉnh Sửa Thông Tin Trường Mầm Non' : 'Thêm Trường Mầm Non Mới'}">Thêm Trường Mầm Non Mới</h1>
                    <p class="page-subtitle">Nhập thông tin đối tác Trường Mầm Non vào hệ thống</p>
                </div>
            </div>

            <div class="card-box card-box-md margin-center">
                <div class="box-header">
                    <h2 class="box-title" th:text="${school != null ? 'Cập Nhật Hồ Sơ Trường #' + school.id : 'Thông Tin Trường Mầm Non'}">Thông Tin Trường Mầm Non</h2>
                </div>

                <form th:action="${school != null} ? @{/admin/schools/edit/{id}(id=${school.id})} : @{/admin/schools/new}"
                      method="post" class="form-layout" data-aka-validate>
                    <div class="form-group">
                        <label class="form-label">Tên Trường Mầm Non *</label>
                        <input type="text" name="name" th:value="${school != null ? school.name : ''}"
                               required minlength="3"
                               placeholder="Nhập tên trường mầm non..." class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Địa chỉ cơ sở</label>
                        <input type="text" name="address" th:value="${school != null ? school.address : ''}"
                               placeholder="Nhập địa chỉ..." class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Người liên hệ</label>
                        <input type="text" name="contactPerson" th:value="${school != null ? school.contactPerson : ''}"
                               placeholder="Họ tên đại diện trường..." class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại (Tối đa 11 số)</label>
                        <input type="tel" name="phone" th:value="${school != null ? school.phone : ''}"
                               data-aka-type="phone"
                               maxlength="11"
                               pattern="0[0-9]{9,10}"
                               inputmode="numeric"
                               placeholder="Số điện thoại liên hệ (tối đa 11 số)..." class="form-control">
                    </div>

                    <div class="form-actions modal-actions">
                        <a th:href="@{/admin/schools}" class="action-btn gray">Hủy bỏ</a>
                        <button type="submit" class="action-btn blue"
                                th:text="${school != null ? 'Cập Nhật Trường Mầm Non' : 'Lưu Trường Mầm Non'}">Lưu Trường Mầm Non</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script th:src="@{/js/form-validate.js}"></script>
</body>
</html>
