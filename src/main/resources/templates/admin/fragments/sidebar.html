<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>
<body>
    <!-- ADMIN SIDEBAR FRAGMENT -->
    <aside class="sidebar" th:fragment="sidebar(activePage)">
        <!-- PURE CSS CHECKBOX HACK FOR SIDEBAR TOGGLE -->
        <input type="checkbox" id="sidebar-toggle-check" class="sidebar-toggle-check" hidden>

        <div>
            <div class="sidebar-header">
                <div class="brand-wrapper">
                    <div class="brand-logo-badge">
                        <img th:src="@{/images/logo.png}" alt="Logo AKA" class="brand-logo-img">
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">AKA</span>
                        <span class="brand-subtext">SCHOOL MANAGER</span>
                    </div>
                </div>
                <label for="sidebar-toggle-check" class="sidebar-toggle-btn" title="Thu gọn / Mở rộng Menu">
                    <i class="ri-arrow-left-s-line"></i>
                </label>
            </div>

            <!-- SECTION 1: QUẢN LÝ VẬN HÀNH -->
            <div class="menu-section-label">QUẢN LÝ VẬN HÀNH</div>
            <nav class="sidebar-nav">
                <a th:href="@{/admin/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <i class="ri-dashboard-3-line nav-icon"></i>
                    <span class="nav-text">Dashboard Cơ sở</span>
                </a>
                <a th:href="@{/admin/schools}" class="nav-item" th:classappend="${activePage == 'schools' ? 'active' : ''}">
                    <i class="ri-building-4-line nav-icon"></i>
                    <span class="nav-text">Trường & Lớp mầm non</span>
                </a>
                <a th:href="@{/admin/schedules}" class="nav-item" th:classappend="${activePage == 'schedules' ? 'active' : ''}">
                    <i class="ri-calendar-event-line nav-icon"></i>
                    <span class="nav-text">Phân công Lịch dạy</span>
                </a>
                <a th:href="@{/admin/change-requests}" class="nav-item" th:classappend="${activePage == 'change-requests' ? 'active' : ''}">
                    <i class="ri-file-text-line nav-icon"></i>
                    <span class="nav-text">Duyệt Nghỉ / Dạy thay</span>
                </a>
                <a th:href="@{/admin/attendances}" class="nav-item" th:classappend="${activePage == 'attendances' ? 'active' : ''}">
                    <i class="ri-checkbox-line nav-icon"></i>
                    <span class="nav-text">Duyệt Chấm công</span>
                </a>
                <a th:href="@{/admin/complaints}" class="nav-item" th:classappend="${activePage == 'complaints' ? 'active' : ''}">
                    <i class="ri-message-3-line nav-icon"></i>
                    <span class="nav-text">Giải quyết Khiếu nại</span>
                </a>
                <a th:href="@{/admin/statistics}" class="nav-item" th:classappend="${activePage == 'statistics' ? 'active' : ''}">
                    <i class="ri-filter-3-line nav-icon"></i>
                    <span class="nav-text">Thống Kê & Truy Vấn</span>
                </a>
            </nav>

            <!-- SECTION 2: QUẢN TRỊ HỆ THỐNG -->
            <div class="menu-section-label margin-top-1">QUẢN TRỊ HỆ THỐNG</div>
            <nav class="sidebar-nav">
                <a th:href="@{/admin/teachers}" class="nav-item" th:classappend="${activePage == 'teachers' ? 'active' : ''}">
                    <i class="ri-user-settings-line nav-icon"></i>
                    <span class="nav-text">Tài khoản & Phân quyền</span>
                </a>
                <a th:href="@{/admin/documents}" class="nav-item" th:classappend="${activePage == 'documents' ? 'active' : ''}">
                    <i class="ri-folder-check-line nav-icon"></i>
                    <span class="nav-text">Biểu mẫu & Chứng từ</span>
                </a>
                <a th:href="@{/admin/system-logs}" class="nav-item" th:classappend="${activePage == 'system-logs' ? 'active' : ''}">
                    <i class="ri-pulse-line nav-icon"></i>
                    <span class="nav-text">Nhật ký Hệ thống</span>
                </a>
            </nav>

        </div>

        <div class="sidebar-footer">
            <div class="user-profile-summary">
                <div class="profile-avatar">
                    <img th:if="${currentUser != null and currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}" 
                         th:src="${currentUser.avatarUrl}" alt="Avatar" class="avatar-img">
                    <i th:unless="${currentUser != null and currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}" 
                       class="ri-user-line avatar-default-icon"></i>
                </div>
                <div class="profile-info">
                    <span class="profile-name" th:text="${teacherName != null ? teacherName : 'Quản trị viên'}">Quản trị viên</span>
                    <span class="profile-role" th:text="${userRole != null ? userRole : 'ROLE_ADMIN'}">ROLE_ADMIN</span>
                </div>
            </div>
            <a th:href="@{/auth/logout}" class="btn-logout">
                <i class="ri-logout-box-r-line logout-icon"></i>
                <span>Đăng xuất</span>
            </a>
        </div>
    </aside>
</body>
</html>
