<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - Admin AKA</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-validate.css}">
</head>
<body>
    <div class="app-container">
        <!-- ADMIN SIDEBAR FRAGMENT -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar('notifications')}"></div>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Thông Báo Quản Trị Hệ Thống</h1>
                    <p class="page-subtitle">Bấm trực tiếp vào từng thông báo để di chuyển tới trang yêu cầu cần xử lý</p>
            <!-- ALERT NOTIFICATIONS -->
            <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert-box alert-error" th:text="${error}"></div>

            <!-- NOTIFICATIONS TABLE BOX -->
            <div class="card-box">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 50%;">NỘI DUNG THÔNG BÁO QUẢN TRỊ (BẤM VÀO ĐỂ XỬ LÝ)</th>
                            <th style="width: 20%;">THỜI GIAN NHẬN</th>
                            <th style="width: 15%; text-align: center;">TRẠNG THÁI</th>
                            <th style="width: 15%; text-align: center;">HÀNH ĐỘNG</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="notif : ${notifications}">
                            <td>
                                <a th:if="${notif.link != null and !#strings.isEmpty(notif.link)}" 
                                   th:href="${notif.link}" 
                                   style="color: #2563eb; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.35rem;"
                                   title="Bấm vào để mở trực tiếp trang xử lý yêu cầu">
                                    <i class="ri-external-link-line" style="font-size: 16px; flex-shrink: 0;"></i>
                                    <span th:text="${notif.message}">Nội dung thông báo</span>
                                </a>
                                <span th:unless="${notif.link != null and !#strings.isEmpty(notif.link)}" th:text="${notif.message}">Nội dung thông báo</span>
                            </td>
                            <td th:text="${#temporals.format(notif.createdAt, 'dd/MM/yyyy HH:mm')}">01/08/2026 08:00</td>
                            <td class="text-center">
                                <span class="status-badge" 
                                      th:classappend="${notif.isRead ? 'approved' : 'pending'}"
                                      th:text="${notif.isRead ? 'Đã đọc' : 'Chờ xử lý'}">Chờ xử lý</span>
                            </td>
                            <td class="text-center">
                                <form th:unless="${notif.isRead}" th:action="@{/admin/notifications/read/{id}(id=${notif.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="action-btn blue">Đánh dấu đã đọc</button>
                                </form>
                                <span th:if="${notif.isRead}" style="color: #94a3b8; font-size: 0.8rem;">—</span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(notifications)}">
                            <td colspan="4" class="empty-table-cell">
                                Chưa có thông báo quản trị mới nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
