<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt Khiếu Nại - Admin AKA</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
</head>
<body>
    <div class="app-container">
        <!-- ADMIN SIDEBAR FRAGMENT -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar('complaints')}"></div>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Giải Quyết Khiếu Nại Tiết Dạy</h1>
                    <p class="page-subtitle">Duyệt yêu cầu điều chỉnh số tiết thực tế của giáo viên</p>
                </div>
            </div>

            <!-- TABLE OF COMPLAINTS -->
            <div class="card-box">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">MÃ</th>
                            <th style="width: 100px;">NGÀY DẠY</th>
                            <th style="width: 150px;">GIÁO VIÊN</th>
                            <th style="width: 170px;">TRƯỜNG</th>
                            <th style="width: 80px; text-align: center;">CA DẠY</th>
                            <th style="width: 110px; text-align: center;">SỐ TIẾT YÊU CẦU</th>
                            <th style="max-width: 220px;">NỘI DUNG KHIẾU NẠI</th>
                            <th style="width: 100px; text-align: center;">TRẠNG THÁI</th>
                            <th style="width: 140px; text-align: center;">HÀNH ĐỘNG</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cmp : ${complaints}">
                            <td class="text-center" th:text="${'#' + cmp.id}">#1</td>
                            <td th:text="${#temporals.format(cmp.attendance.date, 'dd/MM/yyyy')}">04/08/2026</td>
                            <td>
                                <strong th:text="${cmp.attendance.teacher.name}">GV Mai</strong>
                                <br>
                                <small style="color: #2563eb; font-weight: 600;" th:text="${'Mã GV: #' + cmp.attendance.teacher.id}">Mã GV: #1</small>
                            </td>
                            <td th:text="${cmp.attendance.school.name}">Trường Hoa Mai</td>
                            <td class="text-center" th:text="${cmp.attendance.session}">Ca 1</td>
                            <td class="text-center"><strong th:text="${cmp.expectedPeriods}">3</strong> tiết</td>
                            <td style="white-space: normal; max-width: 220px; word-break: break-word;" th:text="${cmp.content}">Nội dung khiếu nại</td>
                            <td class="text-center">
                                <span class="status-badge" 
                                      th:classappend="${cmp.status == 1 ? 'approved' : (cmp.status == 2 ? 'rejected' : 'pending')}" 
                                      th:text="${cmp.status == 1 ? 'Đã duyệt' : (cmp.status == 2 ? 'Từ chối' : 'Chờ duyệt')}">Chờ duyệt</span>
                            </td>
                            <td class="text-center">
                                <div class="form-actions form-actions-reset" style="justify-content: center;">
                                    <form th:action="@{/admin/complaints/approve/{id}(id=${cmp.id})}" method="post">
                                        <button type="submit" class="action-btn green">Duyệt</button>
                                    </form>
                                    <form th:action="@{/admin/complaints/reject/{id}(id=${cmp.id})}" method="post">
                                        <button type="submit" class="action-btn gray">Từ chối</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="9" class="empty-table-cell">Không có khiếu nại nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
