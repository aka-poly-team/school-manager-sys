<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối - AKA School Manager</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        .error-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        .error-icon-box {
            width: 72px;
            height: 72px;
            background-color: #fef2f2;
            color: #dc2626;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .error-desc {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, #09172c 0%, #0d2242 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

    <div class="error-card">
        <div class="error-icon-box">
            <i class="ri-error-warning-line" style="font-size: 38px;"></i>
        </div>
        <h1 class="error-title">Truy cập Bị Từ Chối (403)</h1>
        <p class="error-desc">
            Tài khoản của bạn không có quyền truy cập vào trang này. 
            Vui lòng quay lại bảng điều khiển của bạn.
        </p>
        <a th:href="@{/}" class="btn-back">
            <i class="ri-arrow-left-line" style="font-size: 18px;"></i>
            <span>Quay lại Trang chủ của tôi</span>
        </a>
    </div>

</body>
</html>
