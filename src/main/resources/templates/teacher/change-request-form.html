<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo yêu cầu - AKA School Manager</title>
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('change-requests')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Tạo đơn Xin nghỉ / Đổi ca</h1>
                    <p class="page-subtitle">Gửi đề xuất nghỉ phép hoặc đăng ký dạy thay tới Quản lý</p>
                </div>
            </div>

            <!-- FORM BOX -->
            <div class="card-box card-box-sm">
                <form th:action="@{/teacher/change-requests/new}" method="post" class="form-layout">
                    <div class="form-group">
                        <label class="form-label">Loại yêu cầu</label>
                        <select name="requestType" required class="form-control">
                            <option value="LEAVE">Xin nghỉ phép</option>
                            <option value="SUBSTITUTE">Đăng ký dạy thay</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Lý do xin nghỉ / đổi ca</label>
                        <textarea name="reason" rows="4" placeholder="Nhập lý do chi tiết..." required class="form-control"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="action-btn orange btn-submit-flex">
                            <i data-lucide="send"></i> Gửi Yêu Cầu
                        </button>
                        <a th:href="@{/teacher/change-requests}" class="action-btn gray btn-cancel-link">Hủy</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script th:src="@{/js/teacher-dashboard.js}"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
