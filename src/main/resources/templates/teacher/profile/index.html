<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - AKA School Manager</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-validate.css}">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('profile')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Hồ Sơ Cá Nhân</h1>
                    <p class="page-subtitle">Xem thông tin tài khoản và cập nhật ảnh đại diện của bạn</p>
                </div>
            </div>

            <!-- PROFILE VIEW BOX -->
            <div class="card-box card-box-sm">
                <!-- ALERTS -->
                <div th:if="${error}" class="alert-box alert-error" th:text="${error}"></div>
                <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>

                <!-- FORM ĐỔI ẢNH ĐẠI DIỆN -->
                <form th:action="@{/teacher/profile/avatar}" method="post" enctype="multipart/form-data" id="avatarForm">
                    <div class="user-profile-summary profile-summary-header">
                        <div class="avatar-upload-wrapper" title="Bấm vào để đổi ảnh đại diện" onclick="document.getElementById('avatarFileInput').click();">
                            <div class="top-avatar avatar-lg">
                                <img th:if="${currentUser != null and currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}" 
                                     th:src="${currentUser.avatarUrl}" alt="Avatar" class="avatar-img">
                                <i th:unless="${currentUser != null and currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}" 
                                   class="ri-user-line avatar-icon-lg"></i>
                            </div>
                            <div class="avatar-upload-overlay">
                                <i class="ri-camera-line"></i>
                            </div>
                            <input type="file" name="avatarFile" id="avatarFileInput" accept="image/*" style="display: none;" onchange="document.getElementById('avatarForm').submit();">
                        </div>
                        <div>
                            <h2 class="profile-title-text" th:text="${teacherName != null and !#strings.contains(teacherName, '@') ? teacherName : 'Giáo viên'}">Họ tên Giáo viên</h2>
                            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                                <span class="status-badge approved" th:text="${currentUser != null ? currentUser.role : 'ROLE_TEACHER'}">ROLE_TEACHER</span>
                                <button type="button" class="action-btn outline btn-sm" onclick="document.getElementById('avatarFileInput').click();" style="font-size: 0.75rem; padding: 0.2rem 0.6rem;">
                                    <i class="ri-image-edit-line"></i> Đổi ảnh đại diện
                                </button>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="form-layout margin-top-15">
                    <div class="form-group">
                        <label class="form-label">Họ và tên Giáo viên</label>
                        <input type="text" th:value="${teacher != null ? teacher.name : 'Chưa cập nhật'}" disabled class="form-control form-control-disabled">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Ngày sinh</label>
                        <input type="text" th:value="${teacher != null and teacher.dob != null ? #temporals.format(teacher.dob, 'dd/MM/yyyy') : 'Chưa cập nhật'}" disabled class="form-control form-control-disabled">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Số điện thoại liên hệ</label>
                        <input type="text" th:value="${teacher != null and teacher.phone != null ? teacher.phone : 'Chưa cập nhật'}" disabled class="form-control form-control-disabled">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Hòm thư Email</label>
                        <input type="text" th:value="${teacher != null and teacher.email != null ? teacher.email : 'Chưa cập nhật'}" disabled class="form-control form-control-disabled">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Địa chỉ liên hệ</label>
                        <input type="text" th:value="${teacher != null and teacher.address != null ? teacher.address : 'Chưa cập nhật'}" disabled class="form-control form-control-disabled">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Trạng thái công tác</label>
                        <input type="text" th:value="${teacher != null and teacher.status != null ? (teacher.status == 'active' or teacher.status == 'ACTIVE' ? 'Đang giảng dạy' : (teacher.status == 'inactive' or teacher.status == 'INACTIVE' ? 'Tạm ngưng' : 'Đang giảng dạy')) : 'Đang giảng dạy'}" disabled class="form-control form-control-disabled">
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
