<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh - AKA School Manager</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('attendance')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Nhật ký Điểm danh</h1>
                    <p class="page-subtitle">Lịch sử điểm danh và báo cáo buổi dạy từ CSDL</p>
                </div>
                <a th:href="@{/teacher/attendance/new}" class="btn-primary-action blue">
                    <i data-lucide="plus-circle"></i>
                    <span>Tạo điểm danh mới</span>
                </a>
            </div>

            <!-- ATTENDANCE TABLE BOX -->
            <div class="card-box">
                <table class="attendance-table">
                    <thead>
                        <tr>
                            <th>NGÀY</th>
                            <th>ẢNH XÁC MINH</th>
                            <th>TRƯỜNG MẦM NON</th>
                            <th>LỚP HỌC</th>
                            <th>CA DẠY</th>
                            <th>GIỜ VÀO LỚP</th>
                            <th>SỐ TIẾT</th>
                            <th>TRẠNG THÁI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="att : ${attendances}">
                            <td th:text="${#temporals.format(att.date, 'dd/MM/yyyy')}">29/07/2026</td>
                            <td>
                                <a th:if="${att.selfieImage != null}" th:href="@{${att.selfieImage}}" target="_blank" title="Xem ảnh đầy đủ">
                                    <img th:src="@{${att.selfieImage}}" alt="Selfie" class="selfie-thumb">
                                </a>
                                <span th:unless="${att.selfieImage != null}" class="empty-table-cell">Không có</span>
                            </td>
                            <td th:text="${att.school != null ? att.school.name : 'Chưa rõ'}">Trường Nguyễn Du</td>
                            <td><strong th:text="${att.schoolClass != null ? att.schoolClass.name : 'Lớp'}">8A</strong></td>
                            <td th:text="${att.session}">Ca 1</td>
                            <td th:text="${att.checkInTime}">07:55</td>
                            <td><strong th:text="${att.periods}">2</strong></td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${att.status == 'APPROVED' ? 'approved' : 'pending'}"
                                      th:text="${att.status == 'APPROVED' ? 'Đã duyệt' : 'Chờ duyệt'}">Đã duyệt</span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(attendances)}">
                            <td colspan="8" class="empty-state-text">
                                Chưa có dữ liệu điểm danh nào trong CSDL.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script th:src="@{/js/teacher-dashboard.js}"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
