<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - AKA School Manager</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-validate.css}">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('change-password')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar margin-bottom-1">
                <div>
                    <h1 class="page-title">Đổi Mật Khẩu Bảo Mật</h1>
                    <p class="page-subtitle">Xác thực mã OTP 6 chữ số gửi qua Email trước khi khởi tạo mật khẩu mới</p>
                </div>
            </div>

            <!-- CHANGE PASSWORD FORM BOX -->
            <div class="card-box card-box-sm">
                
                <!-- TIẾN TRÌNH CÁC BƯỚC (STEP INDICATOR) -->
                <div class="step-indicator-bar">
                    <div class="step-item" th:classappend="${step == 1 ? 'active' : (step > 1 ? 'completed' : '')}">
                        <span class="step-number">1</span>
                        <span>1. Gửi mã OTP</span>
                    </div>
                    <i class="ri-arrow-right-s-line" style="color: #cbd5e1;"></i>
                    <div class="step-item" th:classappend="${step == 2 ? 'active' : (step > 2 ? 'completed' : '')}">
                        <span class="step-number">2</span>
                        <span>2. Xác thực OTP</span>
                    </div>
                    <i class="ri-arrow-right-s-line" style="color: #cbd5e1;"></i>
                    <div class="step-item" th:classappend="${step == 3 ? 'active' : ''}">
                        <span class="step-number">3</span>
                        <span>3. Đổi Mật Khẩu</span>
                    </div>
                </div>

                <!-- ALERTS NOTIFICATION FROM SERVER -->
                <div th:if="${error}" class="alert-box alert-box-full alert-error" th:text="${error}">Thông báo lỗi</div>
                <div th:if="${success}" class="alert-box alert-box-full alert-success" th:text="${success}">Thông báo thành công</div>

                <!-- BƯỚC 1: NHẬP EMAIL ĐỂ GỬI MÃ OTP -->
                <div th:if="${step == 1}">
                    <form th:action="@{/teacher/send-otp}" method="post" class="form-layout-compact">
                        <div class="form-group">
                            <label class="form-label">
                                Email tài khoản của bạn * (@gmail.com)
                            </label>
                            <div class="input-with-button">
                                <input type="email" name="email" value=""
                                       placeholder="Nhập email tài khoản của bạn..."
                                       class="form-control" required pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" autocomplete="off">
                                <button type="submit" class="action-btn blue">
                                    Gửi mã OTP
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- BƯỚC 2: NHẬP MÃ OTP ĐỂ XÁC NHẬN -->
                <div th:if="${step == 2}">
                    <form th:action="@{/teacher/verify-otp}" method="post" class="form-layout-compact">
                        <div class="form-group">
                            <label class="form-label">
                                Mã xác thực OTP (6 chữ số từ Email) *
                            </label>
                            <div class="input-with-button">
                                <input type="text" name="otpCode" value=""
                                       placeholder="Nhập mã OTP 6 chữ số..."
                                       class="form-control otp-input-field" required pattern="^\d{6}$" minlength="6" maxlength="6">
                                <button type="submit" class="action-btn green">
                                    Xác nhận OTP
                                </button>
                            </div>
                        </div>
                    </form>
                    <div style="margin-top: 1rem; display: flex; gap: 0.5rem; align-items: center;">
                        <form th:action="@{/teacher/reset-otp}" method="post" style="display: inline;">
                            <button type="submit" class="action-btn gray text-sm">Gửi lại mã / Đổi Email khác</button>
                        </form>
                    </div>
                </div>

                <!-- BƯỚC 3: FORM ĐỔI MẬT KHẨU MỚI (CHỈ HIỆN KHI OTP ĐÃ ĐƯỢC XÁC THỰC THÀNH CÔNG) -->
                <div th:if="${step == 3}">
                    <form th:action="@{/teacher/change-password}" method="post" class="form-layout-compact">
                        <div class="form-group">
                            <label class="form-label">
                                Mật khẩu hiện tại *
                            </label>
                            <input type="password" name="currentPassword" required
                                   placeholder="Nhập mật khẩu hiện tại..."
                                   class="form-control" minlength="6">
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                Mật khẩu mới * (tối thiểu 6 ký tự)
                            </label>
                            <input type="password" name="newPassword" required
                                   placeholder="Nhập mật khẩu mới..."
                                   class="form-control" minlength="6">
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                Xác nhận mật khẩu mới *
                            </label>
                            <input type="password" name="confirmPassword" required
                                   placeholder="Nhập lại mật khẩu mới..."
                                   class="form-control" minlength="6">
                        </div>

                        <div class="form-actions modal-actions" style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
                            <a th:href="@{/teacher/dashboard}" class="action-btn gray">Hủy bỏ</a>
                            <button type="submit" class="action-btn blue">
                                Đổi Mật Khẩu
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
