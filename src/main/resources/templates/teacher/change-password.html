<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - AKA School Manager</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('change-password')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar margin-bottom-1">
                <div>
                    <h1 class="page-title">Đổi Mật Khẩu</h1>
                    <p class="page-subtitle">Cập nhật mật khẩu bảo mật tài khoản của bạn</p>
                </div>
            </div>

            <!-- CHANGE PASSWORD FORM BOX COMPACT -->
            <div class="card-box card-box-sm">
                <!-- ALERTS -->
                <div th:if="${errorMessage}" class="alert-box alert-box-full alert-error" th:text="${errorMessage}">Thông báo lỗi</div>
                <div th:if="${successMessage}" class="alert-box alert-box-full alert-success" th:text="${successMessage}">Thông báo thành công</div>

                <form th:action="@{/teacher/change-password}" method="post" class="form-layout-compact">
                    <div class="form-group">
                        <label class="form-label">Mật khẩu hiện tại</label>
                        <input type="password" name="currentPassword" required placeholder="Nhập mật khẩu hiện tại..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" name="newPassword" required placeholder="Nhập mật khẩu mới..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Xác nhận mật khẩu mới</label>
                        <input type="password" name="confirmPassword" required placeholder="Nhập lại mật khẩu mới..." class="form-control">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="action-btn orange btn-full-width">
                            <i data-lucide="key"></i> <span>Cập Nhật Mật Khẩu</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script th:src="@{/js/teacher-dashboard.js}"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
