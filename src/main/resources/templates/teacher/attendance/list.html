<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh - AKA School Manager</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('attendance')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Nhật ký Điểm danh</h1>
                    <p class="page-subtitle">Lịch sử điểm danh và báo cáo buổi dạy từ CSDL</p>
                </div>
                <a th:href="@{/teacher/attendance/new}" class="btn-primary-action blue">
                    <i class="ri-add-circle-line"></i>
                    <span>Tạo điểm danh mới</span>
                </a>
            </div>

            <!-- ATTENDANCE TABLE BOX -->
            <div class="card-box">
                <table class="attendance-table">
                    <thead>
                        <tr>
                            <th style="width: 110px; text-align: center;">NGÀY</th>
                            <th style="width: 110px; text-align: center;">ẢNH XÁC MINH</th>
                            <th style="width: 180px;">TRƯỜNG MẦM NON</th>
                            <th style="width: 140px;">LỚP HỌC</th>
                            <th style="width: 80px; text-align: center;">CA DẠY</th>
                            <th style="width: 100px; text-align: center;">GIỜ VÀO LỚP</th>
                            <th style="width: 80px; text-align: center;">SỐ TIẾT</th>
                            <th style="width: 110px; text-align: center;">TRẠNG THÁI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="att : ${attendances}">
                            <td class="text-center" th:text="${att.date != null ? #temporals.format(att.date, 'dd/MM/yyyy') : 'N/A'}">29/07/2026</td>
                            <td class="text-center">
                                <a th:if="${att.selfieImage != null and !#strings.isEmpty(att.selfieImage)}" 
                                   th:href="${att.selfieImage}" target="_blank" title="Xem ảnh đầy đủ">
                                    <img th:src="${att.selfieImage}" alt="Selfie" class="selfie-thumb" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=400&q=80';">
                                </a>
                                <span th:unless="${att.selfieImage != null and !#strings.isEmpty(att.selfieImage)}" class="empty-table-cell">Không có</span>
                            </td>
                            <td th:text="${att.school != null ? att.school.name : 'N/A'}">Trường Nguyễn Du</td>
                            <td><strong th:text="${att.schoolClass != null ? att.schoolClass.name : 'N/A'}">8A</strong></td>
                            <td class="text-center" th:text="${att.session}">Ca 1</td>
                            <td class="text-center" th:text="${att.checkInTime}">07:55</td>
                            <td class="text-center"><strong th:text="${att.periods}">2</strong></td>
                            <td class="text-center">
                                <span class="status-badge" 
                                      th:classappend="${att.status == 'APPROVED' ? 'approved' : (att.status == 'LATE' ? 'rejected' : (att.status == 'REJECTED' ? 'rejected' : 'pending'))}"
                                      th:text="${att.status == 'APPROVED' ? 'Đã duyệt' : (att.status == 'LATE' ? 'Vào muộn' : (att.status == 'REJECTED' ? 'Từ chối' : 'Chờ duyệt'))}">Chờ duyệt</span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(attendances)}">
                            <td colspan="8" class="empty-state-text">
                                Chưa có dữ liệu điểm danh nào trong CSDL.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
