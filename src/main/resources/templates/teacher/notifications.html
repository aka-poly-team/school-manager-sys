<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - AKA School Manager</title>
    <link rel="stylesheet" th:href="@{/css/teacher-dashboard.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div th:replace="~{teacher/fragments/sidebar :: sidebar('notifications')}"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 class="page-title">Thông báo hệ thống</h1>
                    <p class="page-subtitle">Danh sách các thông báo dành cho bạn từ CSDL</p>
                </div>
            </div>

            <!-- NOTIFICATIONS TABLE BOX -->
            <div class="card-box">
                <table class="attendance-table">
                    <thead>
                        <tr>
                            <th>NỘI DUNG THÔNG BÁO</th>
                            <th>NGÀY NHẬN</th>
                            <th>TRẠNG THÁI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="notif : ${notifications}">
                            <td>
                                <strong th:text="${notif.message}">Nội dung thông báo</strong>
                            </td>
                            <td th:text="${#temporals.format(notif.createdAt, 'dd/MM/yyyy HH:mm')}">01/08/2026 08:00</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${notif.isRead ? 'approved' : 'pending'}"
                                      th:text="${notif.isRead ? 'Đã đọc' : 'Chưa đọc'}">Chưa đọc</span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(notifications)}">
                            <td colspan="3" style="text-align:center;color:#94a3b8;padding:2rem 0;">
                                Chưa có thông báo mới nào trong CSDL.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script th:src="@{/js/teacher-dashboard.js}"></script>
</body>
</html>
